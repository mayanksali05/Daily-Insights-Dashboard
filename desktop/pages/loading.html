<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Daily Command Center</title>
    <style>
      :root { color-scheme: light dark; --bg: #f3f3f3; --fg: #1a1a1a; --muted: #6b6b6b; --ring: #d4d4d4; --spin: #0d0d0d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #212121; --fg: #ececec; --muted: #9b9b9b; --ring: #424242; --spin: #ececec; } }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             background: var(--bg); color: var(--fg); font: 14px ui-sans-serif, system-ui, "Segoe UI", sans-serif;
             -webkit-app-region: drag; user-select: none; }
      .spinner { width: 28px; height: 28px; border: 3px solid var(--ring); border-top-color: var(--spin);
                 border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 16px; font-weight: 600; margin: 0; }
      p { margin: 0; color: var(--muted); text-align: center; max-width: 320px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h1>Daily Command Center</h1>
    <p>Connecting… If the server was asleep, this can take up to a minute.</p>
  </body>
</html>
